# Bundle patch layer — same two-line shape dsh-sidebar-entries uses:
# the row loads this package's main entry as the host half (a no-op Cordis
# plugin), and the `dsh.client` declaration in package.json makes the web app
# load ./client as the browser half, which is the only part that does anything.
- insert:
    - id: mobile-fixes
      name: dsh-mobile-fixes
